<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sovereign Craft Suite — In-Browser WASM Showcase</title>
  <link data-trunk rel="rust" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #craft_canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .loading-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #38bdf8;
      font-size: 1.2rem;
      font-weight: 600;
      text-align: center;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-overlay">
    <div>⚡ Initializing Pure-Rust WebAssembly Engine...</div>
    <div style="font-size: 0.9rem; color: #94a3b8; margin-top: 8px;">Zero Cloud Dependencies • 60 FPS Canvas</div>
  </div>
  <canvas id="craft_canvas"></canvas>
  <script>
    // Fade out loading screen once canvas receives rendering
    const canvas = document.getElementById('craft_canvas');
    const loading = document.getElementById('loading');
    const checkReady = setInterval(() => {
      if (canvas.width > 0 && canvas.height > 0) {
        loading.style.opacity = '0';
        setTimeout(() => loading.style.display = 'none', 500);
        clearInterval(checkReady);
      }
    }, 100);
  </script>
</body>
</html>
