[package]
name = "craft-showcase-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "WebAssembly interactive in-browser showcase runner for Sovereign Back-Office Suite"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
egui = "0.37.0"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["wasmbind"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlElement", "HtmlCanvasElement", "Element"] }

[lints]
workspace = true
